[project]
name = "genecoli"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.9"
dependencies = [
    "process-bigraph>=0.0.38",
    "vivarium-core>=1.6.5",
    "plum-dispatch>=2.5",
    "bigraph-schema",
    "pydantic>=2.12.5",
    "vecoli>=1.1.2.post1",
    "python-dotenv>=1.2.1",
    "pydantic-settings>=2.12.0",
    "ruff>=0.14.10",
]

[tool.setuptools]
packages = [
    "genEcoli",
    "processes",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.19",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "scipy-stubs>=1.16.3.0",
    "testcontainers[redis]>=4.13.3",
    "tox>=4.32.0",
]
deployment = [
    "build>=1.3.0",
    "twine>=6.2.0",
]

[build-system]
requires = [
    "setuptools",
    "wheel",
    "Cython",
    "numpy"
]
build-backend = "setuptools.build_meta"
