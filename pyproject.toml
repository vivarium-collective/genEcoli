[project]
name = "genecoli"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.9"
dependencies = [
    "process-bigraph>=0.0.38",
    "vivarium-core>=1.6.5",
    "plum-dispatch>=2.5",
    "xarray[complete]>=2025.10.1",
    "bigraph-schema",
    "vecoli",
]

[tool.setuptools]
packages = [
    "genEcoli",
    "processes",
    "data_model",
    "tests"
]

[tool.uv.sources]
bigraph-schema = { path = "../bigraph-schema", editable = true }
vecoli = { path = "../vecoli_fork", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "scipy-stubs>=1.16.3.0",
]
deployment = [
    "build>=1.3.0",
    "twine>=6.2.0",
]

[build-system]
requires = [
    "setuptools",
    "wheel",
    "Cython",
    "numpy"
]
build-backend = "setuptools.build_meta"
